name: Python application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
    - name: Free disk space
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        docker system prune -af || true
        sudo rm -rf /var/lib/apt/lists/*

    - uses: actions/checkout@v6

    - name: Install poetry
      run: python -m pip install poetry

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: "poetry"

    - name: Configure poetry to not create venvs inside project
      run: poetry config virtualenvs.in-project false

    - name: Install system deps for PySide6
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1-mesa-dev
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

    - name: Install dependencies
      run: |
        poetry env use python
        poetry install --no-interaction

    - name: Lint with ruff
      run: poetry run ruff check

    - name: Format with ruff
      run: poetry run ruff format --check

    - name: Run tests
      env:
        MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      run: poetry run pytest

    - name: Create portable demo recording
      run: poetry run python examples/create_demo_recording.py demo-data

    - name: Build wheel and source distribution
      run: poetry build
